<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0F2E">
<title>Espace Maths — Gestion des élèves</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Espace%20Maths%22,%22short_name%22:%22Espace%20Maths%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230D0F2E%22,%22theme_color%22:%22%230D0F2E%22}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0D0F2E;
    --surface:#171A47;
    --surface-2:#232865;
    --line:#333A8A;
    --chalk:#F6F4FF;
    --chalk-dim:#AEB2E0;
    --accent:#FFC857;
    --accent-dim:#6C4FE0;
    --teal:#2FE3C2;
    --danger:#FF6B8B;
    --violet:#8B7BFF;
    --pink:#FF6FB5;
    --radius:16px;
    --serif: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --grad: linear-gradient(135deg,#8B7BFF 0%,#FF6FB5 55%,#FFC857 100%);
    --shadow: 0 10px 30px rgba(4,5,30,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%; overflow-x:hidden;}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 500px at 8% -10%, rgba(139,123,255,.22), transparent 60%),
      radial-gradient(800px 500px at 100% 10%, rgba(255,111,181,.14), transparent 60%),
      radial-gradient(700px 500px at 60% 110%, rgba(47,227,194,.10), transparent 60%),
      linear-gradient(rgba(139,123,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,123,255,.06) 1px, transparent 1px);
    background-size:auto,auto,auto,32px 32px,32px 32px;
    background-attachment:fixed;
    color:var(--chalk);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--serif); font-weight:700; margin:0; letter-spacing:-.01em;}
  a{color:inherit;}
  button{font-family:var(--sans); cursor:pointer; transition:transform .15s, background .2s, color .2s, border-color .2s, box-shadow .2s;}
  button:active{transform:scale(.96);}
  input,select,textarea{font-family:var(--sans);}
  ::selection{background:var(--violet); color:#fff;}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 6deg))}}

  /* ---------- layout ---------- */
  #app{min-height:100vh; display:flex;}
  .app-shell{ display:flex; width:100%; }

  /* ---------- auth screen ---------- */
  .auth-wrap{
    position:relative; overflow:hidden;
    width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .glyph{ position:absolute; font-family:var(--serif); font-weight:800; color:rgba(255,255,255,.07);
    user-select:none; pointer-events:none; animation:floaty 9s ease-in-out infinite; }
  .auth-card{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    background:linear-gradient(180deg, rgba(36,41,102,.82), rgba(23,26,71,.88));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(139,123,255,.45);
    border-radius:24px;
    padding:36px 32px;
    box-shadow:var(--shadow), 0 0 0 6px rgba(139,123,255,.06);
    animation:pop .5s ease both;
  }
  .auth-logo{
    width:58px; height:58px; border-radius:18px; background:var(--grad);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:2rem; font-weight:800; color:#150B33;
    transform:rotate(-6deg); margin-bottom:16px; box-shadow:0 10px 24px rgba(255,111,181,.35);
  }
  .auth-mark{
    font-family:var(--serif); font-size:1.9rem; font-weight:800; line-height:1.1;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px;
  }
  .auth-sub{ color:var(--chalk-dim); font-size:0.95rem; margin-bottom:26px;}
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.8rem; font-weight:600; color:var(--chalk-dim); margin-bottom:6px; letter-spacing:.02em;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:rgba(13,15,46,.7); color:var(--chalk); font-size:0.96rem;
    transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--violet); box-shadow:0 0 0 4px rgba(139,123,255,.22);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 20px; border-radius:12px; border:none; font-size:0.93rem; font-weight:700;
  }
  .btn-primary{ background:var(--grad); color:#170A35; width:100%; box-shadow:0 8px 20px rgba(139,123,255,.35); }
  .btn-primary:hover{ filter:brightness(1.08); box-shadow:0 10px 26px rgba(255,111,181,.4); transform:translateY(-1px); }
  .btn-primary:disabled{ opacity:.6; }
  .btn-ghost{ background:rgba(255,255,255,.03); color:var(--chalk-dim); border:1.5px solid var(--line); }
  .btn-ghost:hover{ color:var(--chalk); border-color:var(--violet); }
  .btn-danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  .auth-toggle{ margin-top:20px; text-align:center; font-size:0.88rem; color:var(--chalk-dim);}
  .auth-toggle button{ background:none; border:none; color:var(--teal); font-weight:700; padding:0 0 0 4px; }
  .auth-toggle button:hover{ text-decoration:underline; }
  .auth-error{ background:rgba(255,107,139,0.14); border:1px solid var(--danger); color:#FFD0DA;
    padding:10px 12px; border-radius:12px; font-size:0.86rem; margin-bottom:16px;}
  .auth-note{ background:rgba(47,227,194,0.12); border:1px solid var(--teal); color:#CFFBF2;
    padding:10px 12px; border-radius:12px; font-size:0.86rem; margin-bottom:16px;}

  /* ---------- shell ---------- */
  .sidebar{
    width:250px; flex-shrink:0;
    background:linear-gradient(180deg, rgba(23,26,71,.95), rgba(13,15,46,.95));
    border-right:1px solid var(--line);
    padding:22px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:12px; padding:0 8px 24px;
    font-family:var(--serif); font-weight:800; font-size:1.25rem; color:var(--chalk); }
  .brand-logo{ width:40px; height:40px; border-radius:13px; background:var(--grad); color:#150B33;
    display:flex; align-items:center; justify-content:center; font-size:1.35rem; transform:rotate(-6deg);
    box-shadow:0 6px 16px rgba(255,111,181,.35); }
  .nav-list{ display:flex; flex-direction:column; gap:3px; }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px;
    color:var(--chalk-dim); text-decoration:none; font-size:0.92rem; font-weight:500; cursor:pointer; border:none; background:none; width:100%; text-align:left;
    position:relative;
  }
  .nav-item > span:first-child{ width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:10px; background:rgba(139,123,255,.14); font-size:1rem; flex-shrink:0; transition:background .2s; }
  .nav-item:hover{ background:rgba(139,123,255,.12); color:var(--chalk); transform:translateX(3px); }
  .nav-item.active{ background:linear-gradient(90deg, rgba(139,123,255,.32), rgba(255,111,181,.14)); color:#fff; font-weight:700; }
  .nav-item.active > span:first-child{ background:var(--grad); }
  .nav-item[data-route="logout"]{ margin-top:10px; color:#FFB3C4; }
  .nav-item[data-route="logout"] > span:first-child{ background:rgba(255,107,139,.16); }
  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); }
  .who{ font-size:0.84rem; color:var(--chalk); padding:10px 12px; border-radius:12px; background:rgba(139,123,255,.12); line-height:1.4; }

  .main{ flex:1; min-width:0; padding:34px 42px 60px; max-width:1240px; animation:rise .4s ease both; }
  .page-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px;}
  .page-head h1{ font-size:2rem; }
  .page-head h1::after{ content:""; display:block; width:54px; height:5px; border-radius:5px; background:var(--grad); margin-top:8px; }
  .page-sub{ color:var(--chalk-dim); font-size:0.9rem; margin-top:10px; }

  .cards-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:28px; }
  .stat-card{ position:relative; overflow:hidden; border-radius:var(--radius); padding:20px 20px 18px;
    background:linear-gradient(145deg, var(--c1,#4B3FD1), var(--c2,#8B7BFF)); color:#fff;
    box-shadow:var(--shadow); animation:rise .5s ease both; }
  .stat-card::after{ content:attr(data-glyph); position:absolute; right:-6px; bottom:-18px; font-family:var(--serif);
    font-size:5.2rem; font-weight:800; color:rgba(255,255,255,.16); line-height:1; }
  .cards-row .stat-card:nth-child(1){ --c1:#5B45E6; --c2:#9B8BFF; }
  .cards-row .stat-card:nth-child(2){ --c1:#0FA88E; --c2:#2FE3C2; color:#04281F; }
  .cards-row .stat-card:nth-child(3){ --c1:#E8458B; --c2:#FF8FB8; animation-delay:.08s; }
  .cards-row .stat-card:nth-child(4){ --c1:#E8962B; --c2:#FFC857; color:#2B1A00; animation-delay:.12s; }
  .cards-row .stat-card:nth-child(2){ animation-delay:.04s; }
  .stat-num{ white-space:nowrap; font-family:var(--serif); font-size:2rem; font-weight:800; line-height:1.1; position:relative; z-index:1; }
  .stat-label{ font-size:0.84rem; margin-top:6px; opacity:.88; font-weight:500; position:relative; z-index:1; }

  .hero{ position:relative; overflow:hidden; border-radius:22px; padding:28px 28px 26px; margin-bottom:24px;
    background:linear-gradient(120deg, rgba(139,123,255,.35), rgba(255,111,181,.22) 60%, rgba(255,200,87,.18));
    border:1px solid rgba(139,123,255,.5); box-shadow:var(--shadow); }
  .hero h2{ font-size:1.5rem; margin-bottom:8px; }
  .hero p{ color:var(--chalk-dim); font-size:0.94rem; line-height:1.65; margin:0 0 16px; max-width:640px; }
  .hero .glyph{ font-size:6rem; right:18px; top:6px; color:rgba(255,255,255,.12); }
  .quick{ display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1; }
  .quick .btn{ width:auto; padding:10px 16px; background:rgba(13,15,46,.55); color:var(--chalk); border:1.5px solid rgba(255,255,255,.18); box-shadow:none; }
  .quick .btn:hover{ background:var(--grad); color:#170A35; border-color:transparent; transform:translateY(-2px); }

  .panel{ background:linear-gradient(180deg, rgba(31,35,92,.85), rgba(23,26,71,.85)); border:1px solid var(--line);
    border-radius:var(--radius); padding:22px; margin-bottom:20px; overflow-x:auto; box-shadow:var(--shadow); animation:rise .45s ease both; }
  .panel h2, .panel h3{ font-size:1.05rem; color:var(--accent); margin-bottom:12px; }
  .group-title{ display:flex; align-items:center; gap:10px; font-size:1.1rem !important; color:var(--chalk) !important; }
  .group-title::before{ content:""; width:12px; height:12px; border-radius:4px; background:var(--gc,#8B7BFF); transform:rotate(45deg); box-shadow:0 0 12px var(--gc,#8B7BFF); flex-shrink:0; }
  .group-count{ margin-left:auto; background:rgba(255,255,255,.08); color:var(--chalk-dim); font-family:var(--sans); font-size:0.76rem; font-weight:600; padding:3px 10px; border-radius:20px; }
  table{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  th{ text-align:left; color:var(--chalk-dim); font-weight:600; font-size:0.74rem; text-transform:uppercase; letter-spacing:.06em; padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:12px 10px; border-bottom:1px solid rgba(51,58,138,0.45); vertical-align:middle;}
  tbody tr{ transition:background .15s; }
  tbody tr:hover{ background:rgba(139,123,255,.09); }
  tr:last-child td{ border-bottom:none; }
  .tag{ display:inline-block; padding:3px 11px; border-radius:20px; font-size:0.75rem; font-weight:700; }
  .tag-ok{ background:rgba(47,227,194,0.16); color:#7FF2DB; }
  .tag-warn{ background:rgba(255,200,87,0.18); color:var(--accent); }
  .tag-bad{ background:rgba(255,107,139,0.18); color:#FFB3C4; }
  .icon-btn{ background:rgba(255,255,255,.04); border:1px solid transparent; color:var(--chalk-dim); padding:5px 8px; border-radius:9px; font-size:0.88rem;}
  .icon-btn:hover{ color:#fff; background:rgba(139,123,255,.28); border-color:rgba(139,123,255,.5); transform:translateY(-1px); }
  .empty-state{ text-align:center; padding:44px 20px; color:var(--chalk-dim); }
  .mini-select{ padding:6px 10px; border-radius:9px; border:1.5px solid var(--line); background:rgba(13,15,46,.7); color:var(--chalk); font-size:0.82rem;}
  .cycle-bar{ display:flex; gap:4px; }
  .cycle-dot{ width:11px; height:11px; border-radius:50%; background:var(--line); }
  .cycle-dot.filled{ background:var(--accent); box-shadow:0 0 8px rgba(255,200,87,.6); }

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(6,7,28,0.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{ background:linear-gradient(180deg,#232865,#171A47); border:1px solid rgba(139,123,255,.5); border-radius:22px; padding:28px;
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 70px rgba(0,0,0,.6); animation:pop .28s ease both;}
  .modal h2{ font-size:1.25rem; margin-bottom:18px;}
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:22px;}

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
  .search-input{ padding:11px 16px; border-radius:999px; border:1.5px solid var(--line); background:rgba(13,15,46,.7); color:var(--chalk); font-size:0.9rem; min-width:240px;
    transition:border-color .2s, box-shadow .2s; }
  .search-input:focus{ outline:none; border-color:var(--violet); box-shadow:0 0 0 4px rgba(139,123,255,.22); }
  .filters-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  input[type="file"]{ color:var(--chalk-dim); }
  a[download], .panel a{ color:var(--teal); }

  @media (max-width: 760px){
    .app-shell{ flex-direction:column; }
    #app{ flex-direction:column; }
    .sidebar{ position:sticky; top:0; z-index:20; width:100%; height:auto; flex-direction:row; overflow-x:auto; padding:10px 10px;
      background:rgba(13,15,46,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border-right:none; border-bottom:1px solid var(--line); }
    .nav-list{ display:flex; flex-direction:row; gap:6px; }
    .brand{ display:none; }
    .sidebar-foot{ display:none; }
    .nav-item{ white-space:nowrap; width:auto; padding:8px 12px 8px 8px; font-size:0.84rem; border-radius:999px; background:rgba(255,255,255,.04); }
    .nav-item:hover{ transform:none; }
    .nav-item > span:first-child{ width:26px; height:26px; }
    .nav-item[data-route="logout"]{ margin-top:0; }
    .nav-badge{ margin-left:4px !important; }
    .main{ padding:20px 16px 50px; max-width:100%; }
    .page-head h1{ font-size:1.6rem; }
    table{ font-size:0.82rem; min-width:560px; }
    .page-head{ align-items:flex-start; }
    .modal{ max-width:100%; padding:22px; }
    .hero{ padding:22px 20px; }
    .hero .glyph{ font-size:4.5rem; }
    .auth-card{ padding:30px 22px; }
    .search-input{ min-width:0; width:100%; }
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>

<body>
<div id="app"></div>

<script>
/* ============================================================
   CONFIGURATION SUPABASE
   ============================================================ */
const SUPABASE_URL = "https://nxfdbgjektcuvnikkmvg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Zvgj54kYet1iBa1pqiPcxw_Ty2uAlMX";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
let state = {
  session: null,
  profile: null,
  route: "dashboard",
  studentsSearch: "",
};

/* Niveaux/sections avec tarif associé (DT par séance, payé tous les 4 séances) */
const NIVEAUX = [
  {value:"1ere_annee", label:"1ère année", filiere:"autre", tarif:40},
  {value:"2eme_annee_sciences", label:"2ème année Sciences", filiere:"sciences", tarif:40},
  {value:"2eme_annee_informatique", label:"2ème année Informatique", filiere:"informatique", tarif:40},
  {value:"2eme_annee_eco", label:"2ème année Économie & Gestion", filiere:"economie_gestion", tarif:40},
  {value:"3eme_annee_sciences", label:"3ème année Sciences", filiere:"sciences", tarif:40},
  {value:"3eme_annee_techniques", label:"3ème année Sciences Techniques", filiere:"sciences_techniques", tarif:40},
  {value:"3eme_annee_informatique", label:"3ème année Informatique", filiere:"informatique", tarif:40},
  {value:"3eme_annee_eco", label:"3ème année Économie & Gestion", filiere:"economie_gestion", tarif:40},
  {value:"bac_sciences", label:"Bac Sciences", filiere:"sciences", tarif:50},
  {value:"bac_techniques", label:"Bac Sciences Techniques", filiere:"sciences_techniques", tarif:50},
  {value:"bac_informatique", label:"Bac Informatique", filiere:"informatique", tarif:50},
  {value:"bac_eco", label:"Bac Économie & Gestion", filiere:"economie_gestion", tarif:50},
  {value:"college", label:"Collège", filiere:"college", tarif:null},
  {value:"autre", label:"Autre", filiere:"autre", tarif:null},
];
const GROUP_COLORS = ["#8B7BFF","#FF6FB5","#2FE3C2","#FFC857","#5CC8FF","#FF8A5B"];
function groupColor(key){ let h=0; for(const c of String(key)) h=(h*31+c.charCodeAt(0))>>>0; return GROUP_COLORS[h%GROUP_COLORS.length]; }
function niveauInfo(label){ return NIVEAUX.find(n=>n.label===label); }

const app = document.getElementById("app");

/* ============================================================
   AUTH
   ============================================================ */
async function init(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if(session){ await loadProfile(); }
  render();
  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    if(session){ loadProfile().then(render); }
    else { state.profile = null; render(); }
  });
}

async function loadProfile(){
  const uid = state.session.user.id;
  let { data } = await sb.from("profiles").select("*").eq("id", uid).single();
  if(!data){
    const { data: profExists } = await sb.rpc("any_prof_exists");
    const role = profExists ? "eleve" : "prof";
    const fullName = state.session.user.user_metadata?.full_name || state.session.user.email;
    const { data: created } = await sb.from("profiles").insert({
      id: uid, role, full_name: fullName
    }).select().single();
    data = created;
  }
  state.profile = data;
  if(data.role === "eleve"){
    const { data: existingStudent } = await sb.from("students").select("id").eq("profile_id", uid).maybeSingle();
    if(!existingStudent){
      const niveauChoisi = state.session.user.user_metadata?.niveau;
      const ni = niveauInfo(niveauChoisi);
      await sb.from("students").insert({
        profile_id: uid,
        full_name: data.full_name,
        niveau: ni ? ni.label : (niveauChoisi || "À définir"),
        filiere: ni ? ni.filiere : "autre",
      });
    }
  }
}

function renderAuth(){
  app.innerHTML = `
  <div class="auth-wrap">
    <span class="glyph" style="font-size:9rem; left:6%; top:8%; --r:-8deg;">∑</span>
    <span class="glyph" style="font-size:7rem; right:8%; top:14%; --r:10deg; animation-delay:-3s;">π</span>
    <span class="glyph" style="font-size:8rem; left:12%; bottom:6%; --r:6deg; animation-delay:-5s;">√</span>
    <span class="glyph" style="font-size:9rem; right:10%; bottom:8%; --r:-6deg; animation-delay:-2s;">∫</span>
    <div class="auth-card">
      <div class="auth-logo">π</div>
      <div class="auth-mark">Espace Maths</div>
      <div class="auth-sub" id="auth-sub">Connecte-toi pour continuer</div>
      <div id="auth-msg"></div>
      <form id="auth-form">
        <div class="field" id="name-field" style="display:none">
          <label>Nom complet</label>
          <input type="text" id="f-name" autocomplete="name">
        </div>
        <div class="field" id="niveau-field" style="display:none">
          <label>Ta section / niveau</label>
          <select id="f-niveau">
            ${NIVEAUX.map(n=>`<option value="${n.label}">${n.label}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="f-email" required autocomplete="email">
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="f-password" required autocomplete="current-password" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" id="auth-submit">Se connecter</button>
      </form>
      <div class="auth-toggle">
        <span id="toggle-label">Pas encore de compte ?</span>
        <button id="toggle-mode">S'inscrire</button>
      </div>
    </div>
  </div>`;

  let mode = "login";
  const form = document.getElementById("auth-form");
  const nameField = document.getElementById("name-field");
  const niveauField = document.getElementById("niveau-field");
  const toggleBtn = document.getElementById("toggle-mode");
  const toggleLabel = document.getElementById("toggle-label");
  const submitBtn = document.getElementById("auth-submit");
  const sub = document.getElementById("auth-sub");
  const msg = document.getElementById("auth-msg");

  toggleBtn.onclick = () => {
    mode = mode === "login" ? "signup" : "login";
    nameField.style.display = mode === "signup" ? "block" : "none";
    niveauField.style.display = mode === "signup" ? "block" : "none";
    submitBtn.textContent = mode === "signup" ? "Créer mon compte" : "Se connecter";
    toggleLabel.textContent = mode === "signup" ? "Déjà un compte ?" : "Pas encore de compte ?";
    toggleBtn.textContent = mode === "signup" ? "Se connecter" : "S'inscrire";
    sub.textContent = mode === "signup" ? "Crée ton compte pour accéder à l'espace" : "Connecte-toi pour continuer";
    msg.innerHTML = "";
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    msg.innerHTML = "";
    const email = document.getElementById("f-email").value.trim();
    const password = document.getElementById("f-password").value;
    const full_name = document.getElementById("f-name").value.trim();
    const niveau = document.getElementById("f-niveau").value;
    submitBtn.disabled = true;
    try{
      if(mode === "signup"){
        const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name, niveau } } });
        if(error) throw error;
        msg.innerHTML = `<div class="auth-note">Compte créé. Si la confirmation par email est activée, vérifie ta boîte mail avant de te connecter.</div>`;
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
    }catch(err){
      msg.innerHTML = `<div class="auth-error">${translateAuthError(err.message)}</div>`;
    }finally{
      submitBtn.disabled = false;
    }
  };
}

function translateAuthError(m){
  if(/invalid login credentials/i.test(m)) return "Email ou mot de passe incorrect.";
  if(/already registered/i.test(m)) return "Un compte existe déjà avec cet email.";
  if(/password/i.test(m) && /6/i.test(m)) return "Le mot de passe doit contenir au moins 6 caractères.";
  return m;
}

function fmtDate(d){ if(!d) return "—"; const dt = new Date(d); return dt.toLocaleDateString("fr-FR"); }
function fmtTime(t){ return t ? t.slice(0,5) : "—"; }
function fmtMoney(n){ return (n===null||n===undefined) ? "—" : `${Number(n).toFixed(2)} DT`; }
function openModal(html){
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  document.body.appendChild(wrap);
  return wrap;
}
function counterBadge(n){
  const cls = n < 0 ? 'tag-warn' : (n >= 4 ? 'tag-bad' : 'tag-ok');
  return `<span class="tag ${cls}" style="font-family:var(--serif); font-size:0.9rem; min-width:22px; text-align:center;" title="Séances depuis le dernier paiement">${n}</span>`;
}

async function renderStudents(main){
  const { data: students, error } = await sb.from("students").select("*").order("full_name");
  if(error) throw error;
  const { data: unread } = await sb.from("chat_messages").select("student_id").eq("sender","eleve").eq("read", false);
  const unreadMap = {};
  (unread||[]).forEach(m=>{ unreadMap[m.student_id] = (unreadMap[m.student_id]||0) + 1; });
  const q = (state.studentsSearch||"").toLowerCase().trim();
  const filtered = students.filter(s=>{
    if(!q) return true;
    return s.full_name.toLowerCase().includes(q) || (s.niveau||"").toLowerCase().includes(q);
  });

  const groups = {};
  filtered.forEach(s=>{
    const key = s.niveau || "Autre";
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  const orderedKeys = [
    ...NIVEAUX.map(n=>n.label).filter(k=>groups[k]),
    ...Object.keys(groups).filter(k=>!NIVEAUX.some(n=>n.label===k)).sort()
  ];

  function studentRow(s){
    const ni = niveauInfo(s.niveau);
    const cnt = s.seances_non_payees || 0;
    return `
            <tr>
              <td>${s.full_name}</td>
              <td>${ni && ni.tarif ? fmtMoney(ni.tarif) : '—'}</td>
              <td>
                <div style="display:flex; align-items:center; gap:6px;">
                  ${counterBadge(cnt)}
                  <button class="icon-btn" data-minus-session="${s.id}" title="Retirer une séance" style="padding:2px 6px;">−</button>
                  <button class="icon-btn" data-plus-session="${s.id}" title="Ajouter une séance effectuée" style="padding:2px 6px;">+</button>
                  <button class="icon-btn" data-pay="${s.id}" title="Enregistrer le paiement dû" style="padding:2px 6px;">💰</button>
                </div>
              </td>
              <td>${s.parent_phone || "—"}</td>
              <td><span class="tag ${s.actif?'tag-ok':'tag-bad'}">${s.actif?'Actif':'Inactif'}</span></td>
              <td style="text-align:right; white-space:nowrap;">
                <button class="icon-btn" data-chat="${s.id}" title="Discuter" style="position:relative;">💬${unreadMap[s.id] ? `<span style="position:absolute; top:-2px; right:-2px; background:var(--danger); color:#fff; font-size:0.62rem; border-radius:50%; min-width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; padding:0 2px;">${unreadMap[s.id]}</span>` : ''}</button>
                <span style="display:inline-block; width:10px;"></span>
                <button class="icon-btn" data-edit="${s.id}" title="Modifier">✎</button>
                <span style="display:inline-block; width:14px;"></span>
                <button class="icon-btn" data-del="${s.id}" title="Supprimer" style="color:var(--danger);">✕</button>
              </td>
            </tr>`;
  }

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Élèves</h1><div class="page-sub">${filtered.length} / ${students.length} élève(s)</div></div>
      <button class="btn btn-primary" id="add-student" style="width:auto;">+ Ajouter un élève</button>
    </div>
    <div class="toolbar">
      <input class="search-input" id="search-students" placeholder="Rechercher par nom ou section…" value="${state.studentsSearch||""}">
    </div>
    ${filtered.length===0 ? `<div class="panel"><div class="empty-state">Aucun élève ne correspond.</div></div>` :
      orderedKeys.map(key=>`
        <div class="panel">
          <h2 class="group-title" style="--gc:${groupColor(key)};">${key} <span class="group-count">${groups[key].length} élève${groups[key].length>1?"s":""}</span></h2>
          <table>
            <thead><tr><th>Nom</th><th>Tarif / 4 séances</th><th>Cycle</th><th>Contact parent</th><th>Statut</th><th></th></tr></thead>
            <tbody>${groups[key].map(studentRow).join("")}</tbody>
          </table>

      `).join("")}
  `;

  document.getElementById("search-students").oninput = (e)=>{ state.studentsSearch = e.target.value; renderStudents(main); };
  document.getElementById("add-student").onclick = () => openStudentForm();
  document.querySelectorAll("[data-plus-session]").forEach(b=> b.onclick = async ()=>{
    const s = students.find(x=>x.id===b.dataset.plusSession);
    await sb.from("students").update({ seances_non_payees: (s.seances_non_payees||0) + 1 }).eq("id", s.id);
    renderPage();

  document.querySelectorAll("[data-minus-session]").forEach(b=> b.onclick = async ()=>{
    const s = students.find(x=>x.id===b.dataset.minusSession);
    const current = s.seances_non_payees || 0;
    if(current === 0){ return; }
    await sb.from("students").update({ seances_non_payees: current - 1 }).eq("id", s.id);
    renderPage();

  document.querySelectorAll("[data-pay]").forEach(b=> b.onclick = ()=> openQuickPaymentForm(students.find(s=>s.id===b.dataset.pay)));
  document.querySelectorAll("[data-chat]").forEach(b=> b.onclick = ()=> openChatModal(students.find(s=>s.id===b.dataset.chat), true));
  document.querySelectorAll("[data-edit]").forEach(b=> b.onclick = ()=> openStudentForm(students.find(s=>s.id===b.dataset.edit)));
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick = async ()=>{
    if(confirm("Supprimer définitivement cet élève, ses données ET son compte de connexion (email libéré pour une nouvelle inscription) ?")){
      const { error } = await sb.rpc("delete_student_account", { student_uuid: b.dataset.del });
      if(error){ alert("Erreur : " + error.message); return; }
      renderPage();
    }
  });
}

/* ============================================================
   PAIEMENT RAPIDE — calcule la différence entre séances étudiées et payées
   ============================================================ */
async function openQuickPaymentForm(student){
  const count = student.seances_non_payees || 0;
  const ni = niveauInfo(student.niveau);
  const tarif = ni && ni.tarif ? ni.tarif : 0;           // prix de 4 séances
  const prixSeance = tarif ? tarif / 4 : 0;               // 50 DT -> 12.5 / 40 DT -> 10
  const suggested = tarif ? tarif.toFixed(2) : "";
  const defSeances = tarif ? 4 : "";
  const modal = openModal(`
    <h2>Paiement — ${student.full_name}</h2>
    <p style="color:var(--chalk-dim); font-size:0.85rem; margin-bottom:14px;">
      Compteur actuel : <strong>${count}</strong> séance(s).
      ${tarif ? `Tarif : ${tarif} DT pour 4 séances (${prixSeance} DT la séance).` : `Précise le niveau de l'élève pour un calcul automatique, ou saisis le nombre de séances à la main.`}
    </p>
    <form id="quick-payment-form">
      <div class="field"><label>Montant reçu (DT)</label><input required type="number" step="0.01" min="0" id="qp-montant" value="${suggested}"></div>
      <div class="field"><label>Séances payées (calculé automatiquement, modifiable)</label><input required type="number" step="1" min="1" id="qp-seances" value="${defSeances}"></div>
      <div id="qp-result" style="background:rgba(47,227,194,.12); border:1px solid var(--teal); color:var(--chalk); padding:10px 12px; border-radius:12px; font-size:0.88rem; margin-bottom:16px;"></div>
      <div class="field"><label>Date</label><input required type="date" id="qp-date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancel-btn">Annuler</button>
        <button type="submit" class="btn btn-primary" style="width:auto;">Enregistrer le paiement</button>
      </div>
    </form>
  `);
  const inMontant = modal.querySelector("#qp-montant");
  const inSeances = modal.querySelector("#qp-seances");
  const result = modal.querySelector("#qp-result");
  function refresh(){
    const n = parseInt(inSeances.value, 10) || 0;
    result.innerHTML = `Compteur : <strong>${count}</strong> − <strong>${n}</strong> = <strong>${count - n}</strong>`;
  }
  inMontant.oninput = ()=>{
    if(prixSeance){
      const m = parseFloat(inMontant.value) || 0;
      inSeances.value = Math.round(m / prixSeance);
    }
    refresh();
  };
  inSeances.oninput = refresh;
  refresh();
  modal.querySelector("#cancel-btn").onclick = ()=> modal.remove();
  modal.querySelector("#quick-payment-form").onsubmit = async (e)=>{
    e.preventDefault();
    const n = parseInt(inSeances.value, 10);
    if(!n || n < 1){ alert("Indique le nombre de séances payées."); return; }
    await sb.from("payments").insert({
      student_id: student.id,
      montant: inMontant.value,
      date_paiement: modal.querySelector("#qp-date").value,
      periode_couverte: n + " séance" + (n>1?"s":""),
      statut: "paye",
    });
    await sb.from("students").update({ seances_non_payees: count - n }).eq("id", student.id);
    modal.remove();
    renderPage();
  };
}

/* ============================================================
   MESSAGERIE PROF <-> ÉLÈVE
   ============================================================ */
async function openChatModal(student, isProfSide){
  const modal = openModal(`
    <h2>Discussion — ${student.full_name}</h2>
    <div id="chat-messages" style="max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:14px; padding:4px;"></div>
    <form id="chat-form" style="display:flex; gap:8px;">
      <input id="chat-input" placeholder="Écris un message…" style="flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--chalk);" autocomplete="off">
      <button type="submit" class="btn btn-primary" style="width:auto;">Envoyer</button>
    </form>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" id="cancel-btn">Fermer</button></div>
  `);
  modal.querySelector("#cancel-btn").onclick = ()=> modal.remove();

  async function loadMessages(){
    const { data: messages } = await sb.from("chat_messages").select("*").eq("student_id", student.id).order("created_at");
    const box = modal.querySelector("#chat-messages");
    if(!messages || messages.length===0){
      box.innerHTML = `<div style="color:var(--chalk-dim); font-size:0.85rem; text-align:center; padding:20px 0;">Aucun message pour l'instant.</div>`;
    } else {
      box.innerHTML = messages.map(m=>{
        const mine = isProfSide ? m.sender==='prof' : m.sender==='eleve';
        return `<div style="align-self:${mine?'flex-end':'flex-start'}; max-width:80%; background:${mine?'var(--accent-dim)':'var(--surface-2)'}; color:var(--chalk); padding:8px 12px; border-radius:10px; font-size:0.88rem;">
          ${m.content}
          <div style="font-size:0.68rem; color:var(--chalk-dim); margin-top:3px;">${new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        </div>`;
      }).join("");
    }
    box.scrollTop = box.scrollHeight;
  }
  await loadMessages();
  await sb.from("chat_messages").update({ read: true }).eq("student_id", student.id).eq("sender", "eleve").eq("read", false);

  modal.querySelector("#chat-form").onsubmit = async (e)=>{
    e.preventDefault();
    const input = modal.querySelector("#chat-input");
    const content = input.value.trim();
    if(!content) return;
    input.value = "";
    await sb.from("chat_messages").insert({
      student_id: student.id,
      sender: isProfSide ? "prof" : "eleve",
      content,
    });
    await loadMessages();
  };
}

    <div class="panel">
      <div id="chat-messages" style="max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:14px; padding:4px;"></div>
      <form id="chat-form" style="display:flex; gap:8px;">
        <input id="chat-input" placeholder="Écris un message…" style="flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--chalk);" autocomplete="off">
        <button type="submit" class="btn btn-primary" style="width:auto;">Envoyer</button>
      </form>
    </div>
  `;
  async function loadMessages(){
    const { data: messages } = await sb.from("chat_messages").select("*").eq("student_id", me.id).order("created_at");
    const box = document.getElementById("chat-messages");
    if(!messages || messages.length===0){
      box.innerHTML = `<div style="color:var(--chalk-dim); font-size:0.85rem; text-align:center; padding:20px 0;">Aucun message pour l'instant.</div>`;
    } else {
      box.innerHTML = messages.map(m=>{
        const mine = m.sender==='eleve';
        return `<div style="align-self:${mine?'flex-end':'flex-start'}; max-width:80%; background:${mine?'var(--accent-dim)':'var(--surface-2)'}; color:var(--chalk); padding:8px 12px; border-radius:10px; font-size:0.88rem;">
          ${m.content}
          <div style="font-size:0.68rem; color:var(--chalk-dim); margin-top:3px;">${new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        </div>`;
      }).join("");
    }
    box.scrollTop = box.scrollHeight;
  }
  await loadMessages();
  await sb.from("chat_messages").update({ read: true }).eq("student_id", me.id).eq("sender", "prof").eq("read", false);
  document.getElementById("chat-form").onsubmit = async (e)=>{
    e.preventDefault();
    const input = document.getElementById("chat-input");
    const content = input.value.trim();
    if(!content) return;
    input.value = "";
    await sb.from("chat_messages").insert({ student_id: me.id, sender: "eleve", content });
    await loadMessages();
  };
}

      </table>`}

/* ============================================================
   RESSOURCES (PDF / VIDÉO) — classées par section et niveau
   ============================================================ */
async function renderResources(main, isProf){
  const { data: resources } = await sb.from("course_resources").select("*").order("niveau").order("ordre");
  let myStudent = null;
  if(!isProf){ myStudent = await myStudentRow(); }

  const visible = (resources||[]).filter(r=>{
    if(!isProf && !r.visible) return false;
    if(!isProf && myStudent){
      const niveauOk = !r.niveau || r.niveau === myStudent.niveau;
      const filiereOk = !r.filiere || r.filiere === myStudent.filiere;
      return niveauOk && filiereOk;
    }
    return true;
  });

  const groups = {};
  visible.forEach(r=>{
    const key = r.niveau || "Tous niveaux";
    groups[key] = groups[key] || [];
    groups[key].push(r);
  });
  const groupKeys = Object.keys(groups).sort();

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Ressources</h1><div class="page-sub">Cours en PDF et vidéo, classés par section et niveau</div></div>
      ${isProf ? `<button class="btn btn-primary" id="add-resource" style="width:auto;">+ Ajouter une ressource</button>` : ``}
    </div>
    ${groupKeys.length===0 ? `<div class="panel"><div class="empty-state">Aucune ressource disponible.</div></div>` :
      groupKeys.map(key => `
      <div class="panel">
        <h3>${key}</h3>
        <table>
          <thead><tr><th>Titre</th><th>Type</th><th>Matière</th>${isProf?'<th>Visible</th><th></th>':'<th></th>'}</tr></thead>
          <tbody>
            ${groups[key].map(r=>`
              <tr>
                <td>${r.titre}${r.description?`<div style="color:var(--chalk-dim); font-size:0.78rem;">${r.description}</div>`:''}</td>
                <td><span class="tag ${r.type==='pdf'?'tag-warn':'tag-ok'}">${r.type.toUpperCase()}</span></td>
                <td>${r.matiere}</td>
                ${isProf?`<td><span class="tag ${r.visible?'tag-ok':'tag-bad'}">${r.visible?'Oui':'Non'}</span></td>
                <td style="text-align:right;"><button class="icon-btn" data-open="${r.id}">Ouvrir</button> <span style="display:inline-block; width:14px;"></span><button class="icon-btn" data-del-res="${r.id}" style="color:var(--danger);">✕</button></td>`
                :`<td style="text-align:right;"><button class="icon-btn" data-open="${r.id}">Télécharger →</button></td>`}
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`).join("")
    }
  `;
  if(isProf){
    document.getElementById("add-resource").onclick = () => openResourceForm();
    document.querySelectorAll("[data-del-res]").forEach(b=> b.onclick = async ()=>{
      if(confirm("Supprimer cette ressource ?")){ await sb.from("course_resources").delete().eq("id", b.dataset.delRes); renderPage(); }
    });
  }
  document.querySelectorAll("[data-open]").forEach(b=> b.onclick = async ()=>{
    const r = visible.find(x=>x.id===b.dataset.open) || (resources||[]).find(x=>x.id===b.dataset.open);
    if(r.video_url){ window.open(r.video_url, "_blank"); }
    else if(r.fichier_path){
      const { data } = await sb.storage.from("course-files").createSignedUrl(r.fichier_path, 3600);
      if(data?.signedUrl) window.open(data.signedUrl, "_blank");
    }
  });
}

function openResourceForm(){
  const modal = openModal(`
    <h2>Ajouter une ressource</h2>
    <form id="resource-form">
      <div class="field"><label>Titre</label><input required id="r-titre"></div>
      <div class="field"><label>Description</label><input id="r-desc"></div>
      <div class="field"><label>Type</label>
        <select id="r-type">
          <option value="pdf">PDF</option>
          <option value="video">Vidéo</option>
        </select>
      </div>
      <div class="field" id="pdf-field"><label>Fichier PDF</label><input type="file" id="r-file" accept="application/pdf"></div>
      <div class="field" id="video-field" style="display:none;"><label>Lien vidéo (YouTube, Vimeo…)</label><input id="r-video-url" placeholder="https://..."></div>
      <div class="field"><label>Section / Niveau (laisser "Tous" si pour tout le monde)</label>
        <select id="r-niveau">
          <option value="">Tous niveaux</option>
          ${NIVEAUX.map(n=>`<option value="${n.label}">${n.label}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Matière</label><input id="r-matiere" value="Mathématiques"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancel-btn">Annuler</button>
        <button type="submit" class="btn btn-primary" style="width:auto;">Publier</button>
      </div>
    </form>
  `);
  const typeSel = modal.querySelector("#r-type");
  typeSel.onchange = ()=>{
    modal.querySelector("#pdf-field").style.display = typeSel.value==="pdf"?"block":"none";
    modal.querySelector("#video-field").style.display = typeSel.value==="video"?"block":"none";
  };
  modal.querySelector("#cancel-btn").onclick = ()=> modal.remove();
  modal.querySelector("#resource-form").onsubmit = async (e)=>{
    e.preventDefault();
    const type = typeSel.value;
    let fichier_path = null, video_url = null;
    if(type==="pdf"){
      const file = modal.querySelector("#r-file").files[0];
      if(file){
        const safeName = file.name
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // enlève les accents
          .replace(/[^a-zA-Z0-9.\-_]/g, "_"); // remplace tout caractère non autorisé par _
        const path = `${Date.now()}_${safeName}`;
        const { error: upErr } = await sb.storage.from("course-files").upload(path, file);
        if(upErr){ alert("Erreur d'upload : " + upErr.message); return; }
        fichier_path = path;
      }
    } else {
      video_url = modal.querySelector("#r-video-url").value.trim();
    }
    const niveauVal = modal.querySelector("#r-niveau").value;
    const ni = niveauInfo(niveauVal);
    await sb.from("course_resources").insert({
      titre: modal.querySelector("#r-titre").value.trim(),
      description: modal.querySelector("#r-desc").value.trim(),
      type, fichier_path, video_url,
      niveau: niveauVal || null,
      filiere: ni ? ni.filiere : null,
      matiere: modal.querySelector("#r-matiere").value.trim(),
    });
    modal.remove();
    renderPage();
  };
}

/* ============================================================
   PLANNING IA
   ============================================================ */
async function renderPlanning(main){
  const { data: suggestions } = await sb.from("schedule_suggestions").select("*, students(full_name)").order("date_proposee");
  main.innerHTML = `
    <div class="page-head"><div><h1>Planning IA</h1><div class="page-sub">Suggestions de créneaux à valider</div></div></div>
    <div class="panel">
      ${(!suggestions || suggestions.length===0) ? `
        <div class="empty-state">
          Aucune suggestion pour l'instant.<br>
          <span style="font-size:0.82rem;">Ce module proposera des créneaux à partir des disponibilités des élèves.</span>
        </div>` : `
      <table>
        <thead><tr><th>Élève</th><th>Date</th><th>Créneau</th><th>Raison</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          ${suggestions.map(s=>`
            <tr>
              <td>${s.students?.full_name||'—'}</td>
              <td>${fmtDate(s.date_proposee)}</td>
              <td>${fmtTime(s.heure_debut)} – ${fmtTime(s.heure_fin)}</td>
              <td>${s.raison||'—'}</td>
              <td><span class="tag ${s.statut==='validee'?'tag-ok':s.statut==='rejetee'?'tag-bad':'tag-warn'}">${s.statut}</span></td>
              <td style="text-align:right;">
                ${s.statut==='proposee'?`<button class="icon-btn" data-valid="${s.id}">✓ Valider</button> <button class="icon-btn" data-reject="${s.id}">✕ Rejeter</button>`:''}
              </td>
            </tr>`).join("")}
        </tbody>
      </table>`}
    </div>
  `;
  document.querySelectorAll("[data-valid]").forEach(b=> b.onclick = async ()=>{
    await sb.from("schedule_suggestions").update({statut:"validee"}).eq("id", b.dataset.valid);
    renderPage();
  });
  document.querySelectorAll("[data-reject]").forEach(b=> b.onclick = async ()=>{
    await sb.from("schedule_suggestions").update({statut:"rejetee"}).eq("id", b.dataset.reject);
    renderPage();
  });
}

/* ============================================================
   VUES ÉLÈVE
   ============================================================ */
async function myStudentRow(){
  const { data } = await sb.from("students").select("*").eq("profile_id", state.session.user.id).maybeSingle();
  return data;
}

async function renderMySessions(main){
  const me = await myStudentRow();
  if(!me){ main.innerHTML = `<div class="empty-state">Ton profil n'est pas encore lié à une fiche élève. Contacte ton professeur.</div>`; return; }
  const count = me.seances_non_payees || 0;
  main.innerHTML = `
    <div class="page-head"><div><h1>Mes séances</h1></div></div>
    <div class="cards-row">
      <div class="stat-card" data-glyph="∑"><div class="stat-num">${count}</div><div class="stat-label">Séance(s) depuis le dernier paiement</div></div>
    </div>
    <div class="panel">
      <p style="color:var(--chalk-dim); font-size:0.9rem; line-height:1.6;">
        Le paiement est dû tous les 4 séances. Ton professeur met ce compteur à jour au fur et à mesure de tes séances.
      </p>
    </div>`;
}

async function renderMyPayments(main){
  const me = await myStudentRow();
  if(!me){ main.innerHTML = `<div class="empty-state">Ton profil n'est pas encore lié à une fiche élève. Contacte ton professeur.</div>`; return; }
  const { data: payments } = await sb.from("payments").select("*").eq("student_id", me.id).order("date_paiement", {ascending:false});
  main.innerHTML = `
    <div class="page-head"><div><h1>Mes paiements</h1></div></div>
    <div class="panel">
      ${(!payments||payments.length===0)?`<div class="empty-state">Aucun paiement enregistré.</div>`:`
      <table><thead><tr><th>Montant</th><th>Date</th><th>Période</th><th>Statut</th></tr></thead>
      <tbody>${payments.map(p=>`<tr><td>${fmtMoney(p.montant)}</td><td>${fmtDate(p.date_paiement)}</td><td>${p.periode_couverte||'—'}</td><td><span class="tag ${p.statut==='paye'?'tag-ok':'tag-warn'}">${p.statut}</span></td></tr>`).join("")}</tbody></table>`}
    </div>`;
}
